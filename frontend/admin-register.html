<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Registration - MatchMyIntern</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { background: #0f172a; }
    .admin-card {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      border: 1px solid rgba(99, 102, 241, 0.3);
      color: white;
    }
    .admin-card .form-label { color: #cbd5e1; }
    .admin-card .form-control {
      background: rgba(15, 23, 42, 0.6);
      border-color: rgba(99, 102, 241, 0.3);
      color: white;
    }
    .admin-card .form-control::placeholder { color: #64748b; }
    .admin-card .form-control:focus {
      background: rgba(15, 23, 42, 0.9);
      border-color: #6366f1;
      color: white;
    }
    .admin-badge {
      display: inline-block;
      background: linear-gradient(135deg, #6366f1, #ec4899);
      color: white;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 2px;
      margin-bottom: 20px;
    }
    .warning-box {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 0.85rem;
      color: #fca5a5;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container"><a class="navbar-brand" href="index.html">🚀 MatchMyIntern</a></div>
  </nav>

  <div class="container mt-5 mb-5">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card admin-card fade-in">
          <div class="card-body p-5 text-center">
            <span class="admin-badge">🛡️ RESTRICTED ACCESS</span>
            <h3 class="fw-bold mb-2">Admin Registration</h3>
            <p class="text-muted mb-4" style="color:#94a3b8 !important;">
              Only authorized personnel can create admin accounts
            </p>

            <div class="warning-box text-start">
              ⚠️ <strong>Warning:</strong> This page is for system administrators only. Unauthorized access attempts are logged.
            </div>

            <form id="adminRegisterForm" class="text-start">
              <div class="mb-3">
                <label class="form-label">Full Name</label>
                <input type="text" id="adminName" class="form-control" placeholder="Admin Name" required>
              </div>
              <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" id="adminEmail" class="form-control" placeholder="admin@matchmyintern.com" required>
              </div>
              <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" id="adminPassword" class="form-control" placeholder="Minimum 6 characters" required>
              </div>
              <div class="mb-4">
                <label class="form-label">Admin Secret Code 🔐</label>
                <input type="password" id="adminSecretCode" class="form-control" placeholder="Enter your secret code" required>
                <small class="text-muted" style="color:#64748b !important;">
                  Provided only to authorized system administrators
                </small>
              </div>
              <button type="submit" class="btn btn-primary w-100 btn-lg">Create Admin Account</button>
            </form>

            <p class="text-center mt-4 mb-0" style="color:#64748b !important;">
              <a href="index.html" class="text-decoration-none" style="color:#6366f1;">← Back to Home</a>
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
