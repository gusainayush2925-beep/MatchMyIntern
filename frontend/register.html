<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register - MatchMyIntern</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container"><a class="navbar-brand" href="index.html">🚀 MatchMyIntern</a></div>
  </nav>

  <div class="container mt-5 mb-5">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card fade-in">
          <div class="card-body p-5">
            <h3 class="text-center fw-bold mb-2">Create Account</h3>
            <p class="text-center text-muted mb-4">Join MatchMyIntern — it's free!</p>
            <form id="registerForm">
              <div class="mb-3">
                <label class="form-label">Full Name</label>
                <input type="text" id="name" class="form-control" placeholder="Ayush Singh" required>
              </div>
              <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" id="email" class="form-control" placeholder="you@example.com" required>
              </div>
              <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" id="password" class="form-control" placeholder="Minimum 6 characters" required>
              </div>
              <div class="mb-3">
                <label class="form-label">Register As</label>
                <select id="role" class="form-select">
                  <option value="student">🎓 Student</option>
                  <option value="recruiter">💼 Recruiter</option>
                </select>
              </div>
              <div class="mb-4" id="companyField" style="display:none;">
                <label class="form-label">Company Name</label>
                <input type="text" id="companyName" class="form-control" placeholder="Tech Solutions Pvt Ltd">
              </div>
              <button type="submit" class="btn btn-primary w-100 btn-lg">Create Account</button>
            </form>
            <p class="text-center mt-4 mb-0 text-muted">
              Already registered? <a href="login.html" class="fw-bold text-decoration-none" style="color:var(--primary);">Login</a>
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
