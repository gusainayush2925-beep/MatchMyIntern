<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Dashboard - MatchMyIntern</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
      <a class="navbar-brand" href="#">🚀 MatchMyIntern</a>
      <div class="ms-auto d-flex align-items-center gap-3">
        <span class="text-white fw-semibold" id="userName">Admin</span>
        <button class="btn btn-warning btn-sm" onclick="logout()">Logout</button>
      </div>
    </div>
  </nav>

  <div class="dashboard-header">
    <div class="container">
      <h1>Admin Dashboard 🛡️</h1>
      <p class="mb-0 opacity-75" style="position:relative;z-index:2;">Manage users, internships, and applications</p>
    </div>
  </div>

  <div class="container">
    <div class="row g-4 mb-5">
      <div class="col-md-2"><div class="stat-card"><h2 id="totalUsers">0</h2><p>Users</p></div></div>
      <div class="col-md-2"><div class="stat-card"><h2 id="totalStudents">0</h2><p>Students</p></div></div>
      <div class="col-md-2"><div class="stat-card"><h2 id="totalRecruiters">0</h2><p>Recruiters</p></div></div>
      <div class="col-md-2"><div class="stat-card"><h2 id="totalInternshipsAdmin">0</h2><p>Internships</p></div></div>
      <div class="col-md-2"><div class="stat-card"><h2 id="totalApplicationsAdmin">0</h2><p>Applications</p></div></div>
      <div class="col-md-2"><div class="stat-card"><h2 id="pendingApplications">0</h2><p>Pending</p></div></div>
    </div>

    <ul class="nav nav-pills mb-4 justify-content-center">
      <li class="nav-item"><button class="nav-link active" data-bs-toggle="pill" data-bs-target="#usersTab">👥 Users</button></li>
      <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#internshipsTab">📋 Internships</button></li>
      <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#appsTab">📩 Applications</button></li>
    </ul>

    <div class="tab-content">
      <div class="tab-pane fade show active" id="usersTab"><div id="usersList"></div></div>
      <div class="tab-pane fade" id="internshipsTab"><div id="internshipsAdminList"></div></div>
      <div class="tab-pane fade" id="appsTab"><div id="appsAdminList"></div></div>
    </div>
  </div>

  <footer><div class="container"><p class="mb-0 opacity-75">© 2026 MatchMyIntern • Team Avengers</p></div></footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
