<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Dashboard - MatchMyIntern</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
      <a class="navbar-brand" href="#">🚀 MatchMyIntern</a>
      <div class="ms-auto d-flex align-items-center gap-3">
        <span class="text-white fw-semibold" id="userName">Loading...</span>
        <button class="btn btn-warning btn-sm" onclick="logout()">Logout</button>
      </div>
    </div>
  </nav>

  <div class="dashboard-header">
    <div class="container">
      <h1>Welcome back, <span id="firstName">Student</span>! 👋</h1>
      <p class="mb-0 opacity-75" style="position:relative;z-index:2;">Your personalized internship dashboard</p>
    </div>
  </div>

  <div class="container">
    <div class="row g-4 mb-5">
      <div class="col-md-3"><div class="stat-card"><h2 id="totalInternships">0</h2><p>Total Internships</p></div></div>
      <div class="col-md-3"><div class="stat-card"><h2 id="totalApplications">0</h2><p>My Applications</p></div></div>
      <div class="col-md-3"><div class="stat-card"><h2 id="topMatches">0</h2><p>Top Matches</p></div></div>
      <div class="col-md-3">
        <div class="stat-card">
          <button class="btn btn-primary w-100" data-bs-toggle="modal" data-bs-target="#skillsModal">
            ✏️ Update Skills
          </button>
          <button class="btn btn-outline-primary w-100 mt-2" data-bs-toggle="modal" data-bs-target="#profileModal">
            👤 Edit Profile
          </button>
        </div>
      </div>
    </div>

    <ul class="nav nav-pills mb-4 justify-content-center" id="dashboardTabs">
      <li class="nav-item"><button class="nav-link active" data-bs-toggle="pill" data-bs-target="#recommended">🎯 Recommended</button></li>
      <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#allInternships">📋 All Internships</button></li>
      <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#myApplications">📩 My Applications</button></li>
    </ul>

    <div class="tab-content">
      <div class="tab-pane fade show active" id="recommended"><div id="recommendationsList"></div></div>
      <div class="tab-pane fade" id="allInternships">
        <div class="card mb-4 p-4">
          <div class="row g-3">
            <div class="col-md-4"><input type="text" id="searchInput" class="form-control" placeholder="🔍 Search internships..."></div>
            <div class="col-md-3"><input type="text" id="locationFilter" class="form-control" placeholder="📍 Location"></div>
            <div class="col-md-3"><input type="text" id="skillsFilter" class="form-control" placeholder="🛠️ Skills (Java, Python)"></div>
            <div class="col-md-2"><button class="btn btn-primary w-100" onclick="searchInternships()">Search</button></div>
          </div>
        </div>
        <div id="allInternshipsList"></div>
      </div>
      <div class="tab-pane fade" id="myApplications"><div id="applicationsList"></div></div>
    </div>
  </div>

  <!-- Skills Modal -->
  <div class="modal fade" id="skillsModal" tabindex="-1">
    <div class="modal-dialog"><div class="modal-content">
      <div class="modal-header"><h5 class="modal-title">Update Your Skills</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body">
        <label class="form-label">Add skills (comma separated)</label>
        <input type="text" id="skillsInput" class="form-control" placeholder="Java, Python, React, Node.js">
        <small class="text-muted d-block mt-2">Example: Java, Android, SQLite, XML</small>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button class="btn btn-primary" onclick="updateSkills()">Save Skills</button>
      </div>
    </div></div>
  </div>

  <!-- Apply Modal -->
  <div class="modal fade" id="applyModal" tabindex="-1">
    <div class="modal-dialog"><div class="modal-content">
      <div class="modal-header"><h5 class="modal-title">Apply for <span id="applyInternshipTitle"></span></h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body">
        <input type="hidden" id="applyInternshipId">
        <div class="mb-3">
          <label class="form-label">Resume * (PDF, DOC, DOCX)</label>
          <input type="file" id="resumeFile" class="form-control" accept=".pdf,.doc,.docx" required>
          <small class="text-muted">Max size: 5 MB</small>
        </div>
        <div class="mb-3">
          <label class="form-label">Cover Letter (Optional)</label>
          <textarea id="coverLetter" class="form-control" rows="4" placeholder="Why are you interested?"></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button class="btn btn-primary" id="submitApplicationBtn" onclick="submitApplication()">Submit Application</button>
      </div>
    </div></div>
  </div>

  <!-- Profile Modal -->
  <div class="modal fade" id="profileModal" tabindex="-1">
    <div class="modal-dialog modal-lg"><div class="modal-content">
      <div class="modal-header"><h5 class="modal-title">Edit Profile</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body">
        <div class="row g-3">
          <div class="col-md-6"><label class="form-label">Phone</label><input type="text" id="profilePhone" class="form-control"></div>
          <div class="col-md-6"><label class="form-label">Bio</label><input type="text" id="profileBio" class="form-control"></div>
          <div class="col-12"><label class="form-label">Education (Degree, College, Year)</label>
            <input type="text" id="eduDegree" class="form-control mb-2" placeholder="Degree (BSc IT)">
            <input type="text" id="eduCollege" class="form-control mb-2" placeholder="College Name">
            <input type="text" id="eduYear" class="form-control" placeholder="Year (2022-2025)">
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button class="btn btn-primary" onclick="updateProfile()">Save Changes</button>
      </div>
    </div></div>
  </div>

  <footer><div class="container"><p class="mb-0 opacity-75">© 2026 MatchMyIntern • Team Avengers</p></div></footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/student.js"></script>
</body>
</html>
