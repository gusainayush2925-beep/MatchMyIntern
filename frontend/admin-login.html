<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - MatchMyIntern</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body { background: #0f172a; }
        .admin-card {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border: 1px solid rgba(99, 102, 241, 0.3);
            color: white;
        }
        .admin-card .form-label { color: #cbd5e1; }
        .admin-card .form-control {
            background: rgba(15, 23, 42, 0.6);
            border-color: rgba(99, 102, 241, 0.3);
            color: white;
        }
        .admin-card .form-control::placeholder { color: #64748b; }
        .admin-card .form-control:focus {
            background: rgba(15, 23, 42, 0.9);
            border-color: #6366f1;
            color: white;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.2);
        }
        .admin-badge {
            display: inline-block;
            background: linear-gradient(135deg, #6366f1, #ec4899);
            color: white;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 20px;
        }
        .security-info {
            background: rgba(99, 102, 241, 0.1);
            border: 1px solid rgba(99, 102, 241, 0.3);
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 0.82rem;
            color: #a5b4fc;
            margin-bottom: 20px;
            text-align: left;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">🚀 MatchMyIntern</a>
        </div>
    </nav>

    <div class="container mt-5 mb-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card admin-card fade-in">
                    <div class="card-body p-5 text-center">
                        <span class="admin-badge">🛡️ ADMIN ACCESS</span>
                        <h3 class="fw-bold mb-2" style="color: white;">Administrator Login</h3>
                        <p class="mb-4" style="color:#94a3b8;">
                            Restricted area — authorized personnel only
                        </p>

                        <div class="security-info">
                            🔒 <strong>Security Notice:</strong> All login attempts are monitored. Only system administrators should access this page.
                        </div>

                        <form id="adminLoginForm" class="text-start">
                            <div class="mb-3">
                                <label class="form-label">Admin Email</label>
                                <input type="email" id="adminEmail" class="form-control" placeholder="admin@matchmyintern.com" required>
                            </div>
                            <div class="mb-4">
                                <label class="form-label">Password</label>
                                <input type="password" id="adminPassword" class="form-control" placeholder="••••••••" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 btn-lg">🔐 Login as Admin</button>
                        </form>

                        <p class="text-center mt-4 mb-0" style="color:#64748b;">
                            <a href="index.html" class="text-decoration-none" style="color:#6366f1;">← Back to Home</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
